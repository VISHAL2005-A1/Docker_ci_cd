name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build HTTP Server
        run: |
          docker build \
            -f Docker/Dockerfile.http \
            -t ${{ secrets.DOCKER_USERNAME }}/http-server:latest .

      - name: Build WebSocket Server
        run: |
          docker build \
            -f Docker/Dockerfile.ws \
            -t ${{ secrets.DOCKER_USERNAME }}/ws-server:latest .

      - name: Build Web
        run: |
          docker build \
            -f Docker/Dockerfile.web \
            -t ${{ secrets.DOCKER_USERNAME }}/web:latest .

      - name: Push HTTP Server
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/http-server:latest

      - name: Push WebSocket Server
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ws-server:latest

      - name: Push Web
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/web:latest


  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/docker_ci_cd

            docker compose pull

            docker compose down

            docker compose up -d

            docker image prune -f