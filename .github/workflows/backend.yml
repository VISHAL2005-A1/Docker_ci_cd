name: Deploy to backend

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Docker/Dockerfile.backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}

      - name: Deploy to Ubuntu VM
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key

          ssh -o StrictHostKeyChecking=no \
            -i ~/ssh_key \
            ubuntu@52.90.132.234 \
            "docker pull ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }} && \
             docker stop user_backend || true && \
             docker rm user_backend || true && \
             docker run -d \
               --name user_backend \
               -p 3000:3000 \
               ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}"